<main class="roles-page"><header><strong>SIGAM</strong><span>Administración</span></header><section class="contenido"><div class="titulo"><h1>Gestión de roles</h1><p>Edita o elimina los roles disponibles en el sistema.</p></div><section *ngIf="editando" class="card formulario"><h2>Editar rol</h2><form (ngSubmit)="guardar()"><label for="nombre">Nombre del rol</label><div class="fila"><input id="nombre" [formControl]="nombre" maxlength="100"><button type="submit">Guardar</button><button class="secundario" type="button" (click)="cancelar()">Cancelar</button></div></form></section><p *ngIf="mensaje" class="mensaje exito">{{ mensaje }}</p><p *ngIf="error" class="mensaje error">{{ error }}</p><section class="card tabla"><div class="tabla-titulo"><h2>Roles registrados</h2><span>{{ roles.length }} roles</span></div><p *ngIf="cargando" class="estado">Cargando roles…</p><p *ngIf="!cargando && roles.length === 0" class="estado">No hay roles registrados.</p><table *ngIf="!cargando && roles.length"><thead><tr><th>ID</th><th>Nombre del rol</th><th>Acciones</th></tr></thead><tbody><tr *ngFor="let rol of roles"><td>#{{ rol.id_rol }}</td><td>{{ rol.nombre }}</td><td><button class="enlace" (click)="editar(rol)">Editar</button><button class="enlace peligro" (click)="eliminar(rol)">Eliminar</button></td></tr></tbody></table></section></section></main>
