<div class="auth-container">
  <div class="auth-card">
    <div class="header-title">
      <h2>SIGAM</h2>
      <p>Inicio de Sesion</p>
    </div>

    <div class="error-text" *ngIf="errorMessage" style="margin-bottom: 1rem;">{{ errorMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electronico *</label>
        <input id="email" type="email" formControlName="email" placeholder="usuario@sigam.com" [class.input-error]="isInvalid('email')" />
        <small class="error-text" *ngIf="isInvalid('email')">Ingresa un correo electronico valido.</small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" [class.input-error]="isInvalid('password')" />
        <small class="error-text" *ngIf="isInvalid('password')">La contraseña es obligatoria.</small>
      </div>

      <div class="forgot-link">
        <a routerLink="/recuperar">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Iniciar Sesion</span>
        <span *ngIf="isLoading">Ingresando...</span>
      </button>

      <div class="login-link">
        ¿No tienes cuenta? <a routerLink="/registro">Registrate</a>
      </div>
    </form>
  </div>
</div>
