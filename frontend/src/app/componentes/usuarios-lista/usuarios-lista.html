<div class="usuarios-container">
  <div class="usuarios-card">
    <div class="usuarios-header">
      <div>
        <p class="eyebrow">SIGAM</p>
        <h2>Usuarios registrados</h2>
      </div>
      <a class="primary-button" routerLink="/registro">Crear usuario</a>
    </div>

    <div class="message error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <div class="table-wrap" *ngIf="!isLoading; else loadingState">
      <table *ngIf="usuarios.length > 0; else emptyState">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Usuario</th>
            <th>Email</th>
            <th>Rol</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let usuario of usuarios">
            <td>{{ usuario.nombre || 'Sin nombre' }}</td>
            <td>{{ usuario.username || 'Sin usuario' }}</td>
            <td>{{ usuario.email || 'Sin correo' }}</td>
            <td>{{ usuario.rol ?? 'Sin rol' }}</td>
          </tr>
        </tbody>
      </table>

      <ng-template #emptyState>
        <div class="empty-state">No hay usuarios registrados todavía.</div>
      </ng-template>
    </div>

    <ng-template #loadingState>
      <div class="loading-state">Cargando usuarios...</div>
    </ng-template>
  </div>
</div>
