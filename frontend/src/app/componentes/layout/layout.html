<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>SIGAM</h2>
      <p>Panel de administracion</p>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/panel/incidentes" routerLinkActive="active" class="sidebar-link">
        <span class="sidebar-icon">🚑</span> Incidentes
      </a>
      <a routerLink="/panel/usuarios" routerLinkActive="active" class="sidebar-link">
        <span class="sidebar-icon">👤</span> Usuarios
      </a>
      <a routerLink="/panel/roles" routerLinkActive="active" class="sidebar-link">
        <span class="sidebar-icon">🛡</span> Roles
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout-sidebar" (click)="cerrarSesion()">
        <span class="sidebar-icon">⏻</span> Cerrar sesion
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
