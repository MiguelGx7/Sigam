<div class="auth-container">
  <div class="auth-card">
    <div class="header-title">
      <h2>SIGAM</h2>
      <p *ngIf="!modoConfirmar">Recuperar Contraseña</p>
      <p *ngIf="modoConfirmar">Nueva Contraseña</p>
    </div>

    <div class="error-text" *ngIf="errorMessage" style="margin-bottom: 1rem;">{{ errorMessage }}</div>
    <div class="success-text" *ngIf="successMessage" style="margin-bottom: 1rem;">{{ successMessage }}</div>

    <!-- Fase 1: pedir el correo -->
    <form *ngIf="!modoConfirmar" [formGroup]="solicitarForm" (ngSubmit)="onSolicitar()">
      <div class="form-group">
        <label for="email">Correo Electronico *</label>
        <input id="email" type="email" formControlName="email" placeholder="usuario@sigam.com" [class.input-error]="isInvalidSolicitar('email')" />
        <small class="error-text" *ngIf="isInvalidSolicitar('email')">Ingresa un correo electronico valido.</small>
      </div>

      <button type="submit" class="btn-submit" [disabled]="solicitarForm.invalid || isLoading">
        <span *ngIf="!isLoading">Enviar instrucciones</span>
        <span *ngIf="isLoading">Enviando...</span>
      </button>

      <div class="login-link">
        <a routerLink="/login">Volver a inicio de sesion</a>
      </div>
    </form>

    <!-- Fase 2: definir nueva contraseña (uid/token vienen en la URL) -->
    <form *ngIf="modoConfirmar" [formGroup]="confirmarForm" (ngSubmit)="onConfirmar()">
      <div class="form-group">
        <label for="nuevaPassword">Nueva Contraseña *</label>
        <input id="nuevaPassword" type="password" formControlName="nuevaPassword" placeholder="••••••••" [class.input-error]="isInvalidConfirmar('nuevaPassword')" />
        <small class="error-text" *ngIf="isInvalidConfirmar('nuevaPassword')">Minimo 6 caracteres.</small>
      </div>

      <div class="form-group">
        <label for="confirmarPassword">Confirmar Contraseña *</label>
        <input id="confirmarPassword" type="password" formControlName="confirmarPassword" placeholder="••••••••" [class.input-error]="isInvalidConfirmar('confirmarPassword')" />
        <small class="error-text" *ngIf="confirmarForm.get('confirmarPassword')?.hasError('passwordMismatch') && (confirmarForm.get('confirmarPassword')?.dirty || confirmarForm.get('confirmarPassword')?.touched)">
          Las contraseñas no coinciden.
        </small>
      </div>

      <button type="submit" class="btn-submit" [disabled]="confirmarForm.invalid || isLoading">
        <span *ngIf="!isLoading">Cambiar Contraseña</span>
        <span *ngIf="isLoading">Guardando...</span>
      </button>

      <div class="login-link">
        <a routerLink="/login">Volver a inicio de sesion</a>
      </div>
    </form>
  </div>
</div>
